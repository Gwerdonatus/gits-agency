name: Build

# Builds on Linux, which is the point: the OpenNext Cloudflare adapter is not
# fully supported on Windows and its build fails there with
# ERR_UNSUPPORTED_ESM_URL_SCHEME on absolute C:\ paths.
#
# This workflow does NOT deploy. Deployment belongs to the Cloudflare Workers
# Git integration, which builds and ships every push itself — you can see it on
# a pull request as the "Workers Builds: gits" check, with its own preview URL.
#
# It used to end in a `wrangler deploy` step, which meant two deploys racing on
# every push to main. In practice it never got that far: CLOUDFLARE_API_TOKEN was
# never set on the repository, so wrangler failed its credential check in about
# three seconds and marked every push to main red. The build had already passed
# by then, so the red X said nothing about the commit. Removing the step drops
# the duplicate deploy and the false alarm together.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight build rather than racing it.
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Public values, inlined into the client bundle at build time. They are
      # readable in the shipped JS either way, so they are repository variables
      # rather than secrets — with the same fallbacks the code uses.
      NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ vars.NEXT_PUBLIC_SANITY_PROJECT_ID || 'vih4pg3q' }}
      NEXT_PUBLIC_SANITY_DATASET: ${{ vars.NEXT_PUBLIC_SANITY_DATASET || 'production' }}
      NEXT_PUBLIC_SANITY_API_VERSION: ${{ vars.NEXT_PUBLIC_SANITY_API_VERSION || '2025-05-21' }}
      # Read token: the blog reads from Sanity during the build.
      SANITY_API_READ_TOKEN: ${{ secrets.SANITY_API_READ_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci
        env:
          # puppeteer is only used by scripts/capture-work-screenshots.mjs, which
          # is run by hand. Without this it downloads a ~170MB Chromium on every
          # CI run for nothing.
          PUPPETEER_SKIP_DOWNLOAD: "true"

      - name: Typecheck
        run: npx tsc --noEmit

      # Guards the AI advisor's intent router: whether a visitor's message is
      # answered or fed to the discovery ladder is decided by src/lib/advisor,
      # and a regression there is invisible until a customer is stonewalled.
      - name: Check advisor intents
        run: npm run check:advisor

      - name: Build worker
        run: npm run build:worker

      - name: Summary
        if: always()
        run: |
          {
            echo "### Build"
            echo ""
            echo "- commit: \`${{ github.sha }}\`"
            echo "- typecheck, advisor intent checks and worker build: completed"
            echo "- deployment is handled by the Cloudflare Workers Git integration"
          } >> "$GITHUB_STEP_SUMMARY"
